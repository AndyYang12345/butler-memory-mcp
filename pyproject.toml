[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "butler-memory-mcp"
version = "0.2.1"
description = "MCP bridge over the AI Butler Framework layered memory services"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "AI Butler Framework contributors" }]

[project.urls]
Repository = "https://github.com/AndyYang12345/butler-memory-mcp"
dependencies = [
  # Self-contained: the memory domain code is vendored under
  # ai_butler_memory_mcp/vendored/ (see VENDORED.md), so this package does
  # NOT depend on ai-butler-framework at runtime.
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "pydantic>=2.7,<3",
  "asyncpg>=0.30,<1",
  "fastapi>=0.139,<0.140",
  "uvicorn>=0.51,<0.52",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]

[project.scripts]
ai-butler-memory-mcp = "ai_butler_memory_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
