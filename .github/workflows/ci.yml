name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Self-contained: the memory domain code is vendored, so a normal
      # editable install resolves every dependency from PyPI.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Offline MCP protocol tests
        run: pytest -q

      - name: Vendored modules compile
        run: python -m py_compile src/ai_butler_memory_mcp/vendored/*.py

      - name: Vendored import smoke
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from ai_butler_memory_mcp.vendored.memory_service import MemoryService
          from ai_butler_memory_mcp.vendored.layered_memory import LayeredMemoryService
          from ai_butler_memory_mcp.vendored.models import Memory
          print('vendored imports OK')"

  # Local-only (requires the upstream checkout):
  #   python scripts/check-vendored.py --upstream ../ai-butler-framework
  # A PostgreSQL integration job can be added later with a postgres service
  # container running the real create -> search -> revise -> conflict ->
  # archive chain.
