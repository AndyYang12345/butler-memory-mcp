name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runtime dependency ai-butler-framework is not yet published to
      # PyPI; the offline protocol suite does not import it, so install the
      # bridge without dependency resolution for now. Switch to a normal
      # `pip install -e '.[dev]'` once the upstream package is released, and
      # add the PostgreSQL integration job below at the same time.
      - name: Install
        run: |
          pip install --no-deps -e .
          pip install "pytest>=7.4,<9"

      - name: Offline MCP protocol tests
        run: pytest -q

  # TODO(release): once ai-butler-framework is on PyPI, add an integration
  # job with a postgres service container running the real MemoryService
  # create -> search -> revise -> conflict -> archive chain.
